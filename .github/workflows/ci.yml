name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch head, 2026-07-02
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make build
      - run: make test
      - run: make lint
      - run: make fmt

  # The readstate backend (non-default feature) pulls the zebra crate tree; without this lane a
  # change to the shared types (NodeRpc, NodeError, the RPC structs) could silently break the
  # feature build until the next manual run. Kept separate from `test` so the default lane stays
  # lean and both populate their own rust-cache.
  test-readstate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch head, 2026-07-02
        with:
          components: clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --features readstate --all-targets -- -D warnings
      - run: cargo test --features readstate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker build -t lightwalletd-rs .

      # The runtime image is a different environment from the one the tests run in, and the HTTP
      # client resolves its glibc, TLS provider and CA store only when a client is constructed at
      # startup, plaintext deployment or not. `--help` exits before that, so this starts the server
      # against a port nothing listens on: still running after 10s means startup cleared all three.
      - name: the image starts and builds its node client
        run: |
          docker run -d --name smoke lightwalletd-rs \
            --rpc-url http://127.0.0.1:1 \
            --no-tls-very-insecure \
            --no-metrics \
            --data-dir /tmp/smoke
          sleep 10
          docker logs smoke
          if ! docker ps --filter name=smoke --filter status=running --format '{{.Names}}' \
              | grep -qx smoke; then
            echo "::error::the server exited instead of retrying the unreachable node (log above)"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    # audit-check publishes its result as a check run, which needs write access
    # the default read-only workflow token does not have.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch head, 2026-07-02
      - run: rustup override set stable
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build
      - run: cargo test
