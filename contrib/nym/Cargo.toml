# Its own workspace root on purpose: this project must never join the parent crate's lockfile.
[workspace]

[package]
name = "nym-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
nym-sdk = "=1.21.5-rc.3"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[[bin]]
name = "sp"
path = "src/bin/sp.rs"

[[bin]]
name = "dial"
path = "src/bin/dial.rs"

[[bin]]
name = "repro"
path = "src/bin/repro.rs"
