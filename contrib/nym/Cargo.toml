# Its own workspace root on purpose: this project must never join the parent crate's lockfile.
[workspace]

[package]
name = "nym-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
# This branch tracks an unreleased SDK branch: the establishment acknowledgement the rig waits on
# does not exist in any published version. `main` keeps the release pin, `=1.21.5-rc.3`.
nym-sdk = { git = "https://github.com/nymtech/nym", rev = "f5e46b7d8287869221cd6632c63444d4b32da59c" }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[[bin]]
name = "sp"
path = "src/bin/sp.rs"

[[bin]]
name = "dial"
path = "src/bin/dial.rs"

[[bin]]
name = "repro"
path = "src/bin/repro.rs"
